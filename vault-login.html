<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in. Jeong AI vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500&family=Noto+Serif+KR:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20260917">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    .vault-login { min-height: 100svh; display: grid; align-content: center; padding: var(--s7) var(--gutter); }
    .vault-login .wordmark { margin-bottom: var(--s6); }
    .vault-login .display { margin-bottom: var(--s3); }
    .vault-login .providers { display: grid; gap: var(--s3); max-width: 22rem; margin: var(--s5) 0; }
    .vault-login .providers .button { text-align: left; }
  </style>
</head>
<body class="field-navy">

  <main class="vault-login">
    <a href="/" class="wordmark" aria-label="Jeong AI, home"><img src="/brand/assets/jeong-mark-gold.png" alt="" width="968" height="1104">Jeong <span class="ai">AI</span></a>
    <p class="eyebrow">Document vault</p>
    <h1 class="display"><em>Sign in to continue.</em></h1>
    <p class="lede">Secure documents and resources for clients and partners. Use the account you were given access with.</p>
    <div class="providers">
      <a href="/.auth/login/aad?post_login_redirect_uri=/vault" class="button">Sign in with Microsoft</a>
      <a href="/.auth/login/github?post_login_redirect_uri=/vault" class="button">Sign in with GitHub</a>
      <a href="/.auth/login/google?post_login_redirect_uri=/vault" class="button">Sign in with Google</a>
    </div>
    <a class="textlink" href="/">Back to Jeong AI</a>
  </main>

</body>
</html>
